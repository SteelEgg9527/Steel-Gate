<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="b17title b17desc">
  <title id="b17title">B-17 Flying Fortress — simplified top view</title>
  <desc id="b17desc">Vector line drawing. Length 22.6 m, wingspan 31.6 m. Four engines, rounded wing tips, single vertical tail and tail gun.</desc>
  <g fill="none" stroke="#181713" stroke-linecap="round" stroke-linejoin="round">
    <!-- horizontal tail: 12.8 m span -->
    <g>
      <path d="M500 520 L647 550 Q654 552 653 560 L650 582 Q648 590 639 590 L500 598 Z" fill="#fbf9f1"/>
      <path d="M500 520 L353 550 Q346 552 347 560 L350 582 Q352 590 361 590 L500 598 Z" fill="#fbf9f1"/>
      <path d="M500 522 L500 599" stroke-width="1.1"/>
      <path d="M615 560 L610 580" stroke-width="1"/>
      <path d="M385 560 L390 580" stroke-width="1"/>
      <path d="M500 560 L645 580" stroke-width="1"/>
      <path d="M500 560 L355 580" stroke-width="1"/>
    </g>

    <!-- main wing: 31.6 m span -->
    <g>
      <path d="M500 278 L816 281 Q850 282 866 290 Q879 297 878 310 Q877 329 861 334 Q846 339 820 339 L500 421 Z" fill="#fbf9f1"/>
      <path d="M500 278 L184 281 Q150 282 134 290 Q121 297 122 310 Q123 329 139 334 Q154 339 180 339 L500 421 Z" fill="#fbf9f1"/>
      <!-- spar / panel lines -->
      <path d="M500 293 L846 296" stroke-width="1.05"/>
      <path d="M500 311 L864 312" stroke-width="0.9"/>
      <path d="M500 394 L836 343" stroke-width="1"/>
      <path d="M500 407 L820 350" stroke-width="0.8"/>
      <path d="M500 293 L165 296" stroke-width="1.05"/>
      <path d="M500 311 L136 312" stroke-width="0.9"/>
      <path d="M500 394 L164 343" stroke-width="1"/>
      <path d="M500 407 L180 350" stroke-width="0.8"/>
      <!-- ailerons and flaps -->
      <path d="M790 334 L850 333 L858 322 L810 322 Z" stroke-width="1.2"/>
      <path d="M210 334 L150 333 L142 322 L190 322 Z" stroke-width="1.2"/>
      <path d="M650 344 L738 341 L758 337 L664 340 Z" stroke-width="1.2"/>
      <path d="M350 344 L262 341 L242 337 L336 340 Z" stroke-width="1.2"/>
      <path d="M566 402 L650 380 L650 376 L570 396 Z" stroke-width="1.1"/>
      <path d="M434 402 L350 380 L350 376 L430 396 Z" stroke-width="1.1"/>
      <!-- wing tip navigation lights -->
      <path d="M865 309 Q878 310 877 320" stroke-width="2.4"/>
      <path d="M135 309 Q122 310 123 320" stroke-width="2.4"/>
    </g>

    <!-- four engine nacelles -->
    <g>
      <!-- inboard right -->
      <g transform="translate(634 0)">
        <path d="M-18 232 Q-18 222 0 222 Q18 222 18 232 L18 365 Q18 384 8 391 L0 395 L-8 391 Q-18 384 -18 365 Z" fill="#fbf9f1" stroke-width="1.8"/>
        <path d="M-15 250 L-15 363" stroke-width="0.8"/>
        <path d="M15 250 L15 363" stroke-width="0.8"/>
        <path d="M-17 368 Q0 376 17 368" stroke-width="0.8"/>
      </g>
      <!-- outboard right -->
      <g transform="translate(738 0)">
        <path d="M-17 228 Q-17 218 0 218 Q17 218 17 228 L17 345 Q17 357 8 363 L0 367 L-8 363 Q-17 357 -17 345 Z" fill="#fbf9f1" stroke-width="1.8"/>
        <path d="M-14 246 L-14 343" stroke-width="0.8"/>
        <path d="M14 246 L14 343" stroke-width="0.8"/>
        <path d="M-16 348 Q0 356 16 348" stroke-width="0.8"/>
      </g>
      <!-- inboard left -->
      <g transform="translate(366 0)">
        <path d="M-18 232 Q-18 222 0 222 Q18 222 18 232 L18 365 Q18 384 8 391 L0 395 L-8 391 Q-18 384 -18 365 Z" fill="#fbf9f1" stroke-width="1.8"/>
        <path d="M-15 250 L-15 363" stroke-width="0.8"/>
        <path d="M15 250 L15 363" stroke-width="0.8"/>
        <path d="M-17 368 Q0 376 17 368" stroke-width="0.8"/>
      </g>
      <!-- outboard left -->
      <g transform="translate(262 0)">
        <path d="M-17 228 Q-17 218 0 218 Q17 218 17 228 L17 345 Q17 357 8 363 L0 367 L-8 363 Q-17 357 -17 345 Z" fill="#fbf9f1" stroke-width="1.8"/>
        <path d="M-14 246 L-14 343" stroke-width="0.8"/>
        <path d="M14 246 L14 343" stroke-width="0.8"/>
        <path d="M-16 348 Q0 356 16 348" stroke-width="0.8"/>
      </g>
    </g>

    <!-- propellers: three blades each, 3.8 m diameter -->
    <g stroke-width="1.6">
      <g transform="translate(634 222)">
        <circle r="3.2" fill="#fbf9f1"/>
        <path d="M0 -45 C5 -34 4 -22 0 -7 C-4 -22 -5 -34 0 -45 Z" fill="#fbf9f1"/>
        <path d="M39 22 C29 20 19 12 8 2 C22 4 34 10 39 22 Z" fill="#fbf9f1"/>
        <path d="M-39 22 C-29 20 -19 12 -8 2 C-22 4 -34 10 -39 22 Z" fill="#fbf9f1"/>
      </g>
      <g transform="translate(738 218)">
        <circle r="3.2" fill="#fbf9f1"/>
        <path d="M0 -43 C5 -33 4 -21 0 -7 C-4 -21 -5 -33 0 -43 Z" fill="#fbf9f1"/>
        <path d="M37 21 C28 19 18 12 8 2 C21 4 32 10 37 21 Z" fill="#fbf9f1"/>
        <path d="M-37 21 C-28 19 -18 12 -8 2 C-21 4 -32 10 -37 21 Z" fill="#fbf9f1"/>
      </g>
      <g transform="translate(366 222)">
        <circle r="3.2" fill="#fbf9f1"/>
        <path d="M0 -45 C5 -34 4 -22 0 -7 C-4 -22 -5 -34 0 -45 Z" fill="#fbf9f1"/>
        <path d="M39 22 C29 20 19 12 8 2 C22 4 34 10 39 22 Z" fill="#fbf9f1"/>
        <path d="M-39 22 C-29 20 -19 12 -8 2 C-22 4 -34 10 -39 22 Z" fill="#fbf9f1"/>
      </g>
      <g transform="translate(262 218)">
        <circle r="3.2" fill="#fbf9f1"/>
        <path d="M0 -43 C5 -33 4 -21 0 -7 C-4 -21 -5 -33 0 -43 Z" fill="#fbf9f1"/>
        <path d="M37 21 C28 19 18 12 8 2 C21 4 32 10 37 21 Z" fill="#fbf9f1"/>
        <path d="M-37 21 C-28 19 -18 12 -8 2 C-21 4 -32 10 -37 21 Z" fill="#fbf9f1"/>
      </g>
    </g>

    <!-- fuselage: 22.6 m long, 2.4 m wide -->
    <path d="M500 80
             C486 80 477 88 474 102
             L470 142
             L470 421
             C471 456 474 492 480 525
             C486 560 493 590 500 622
             C507 590 514 560 520 525
             C526 492 529 456 530 421
             L530 142
             L526 102
             C523 88 514 80 500 80 Z"
          fill="#fbf9f1" stroke-width="2.3"/>

    <!-- vertical fin, seen edge-on from above -->
    <path d="M500 500 L495 558 Q494 582 500 618 Q506 582 505 558 Z" fill="#fbf9f1" stroke-width="1.6"/>
    <path d="M500 500 L500 620" stroke-width="0.9"/>

    <!-- cockpit, nose glazing, turrets -->
    <g stroke-width="1.15">
      <path d="M478 143 Q500 126 522 143 L526 166 Q500 178 474 166 Z" fill="#fbf9f1"/>
      <path d="M500 128 L500 170"/>
      <path d="M481 150 L519 150"/>
      <path d="M478 160 Q500 170 522 160"/>
      <!-- chin turret -->
      <circle cx="500" cy="118" r="10.5" fill="#fbf9f1"/>
      <path d="M493 116 L507 116 M500 110 L500 126"/>
      <!-- top turret -->
      <circle cx="500" cy="218" r="17" fill="#fbf9f1" stroke-width="1.4"/>
      <path d="M486 211 Q500 198 514 211"/>
      <path d="M500 201 L500 235"/>
      <!-- radio room hatch -->
      <path d="M489 300 Q500 293 511 300 L511 316 Q500 323 489 316 Z"/>
      <!-- ball turret ring, seen through lower fuselage -->
      <circle cx="500" cy="352" r="13" stroke-width="1"/>
      <circle cx="500" cy="352" r="4" stroke-width="0.9"/>
      <!-- waist gun positions -->
      <circle cx="471" cy="392" r="4.5" stroke-width="1"/>
      <circle cx="529" cy="392" r="4.5" stroke-width="1"/>
      <!-- tail gun -->
      <path d="M492 604 Q500 597 508 604 L507 618 Q500 623 493 618 Z" fill="#fbf9f1"/>
      <path d="M500 603 L500 623"/>
    </g>

    <!-- fuselage panel lines -->
    <g stroke="#181713" stroke-width="0.7" opacity="0.72">
      <path d="M473 190 Q500 182 527 190"/>
      <path d="M472 240 Q500 232 528 240"/>
      <path d="M472 274 Q500 266 528 274"/>
      <path d="M472 330 Q500 322 528 330"/>
      <path d="M472 372 Q500 364 528 372"/>
      <path d="M472 424 Q500 416 528 424"/>
      <path d="M474 470 Q500 462 526 470"/>
      <path d="M476 512 Q500 504 524 512"/>
      <path d="M482 554 Q500 547 518 554"/>
      <path d="M487 582 Q500 576 513 582"/>
      <path d="M500 190 L500 602"/>
    </g>

    <!-- small fuselage framing / access panels -->
    <g stroke-width="0.65" opacity="0.7">
      <path d="M485 252 L515 252 M485 258 L515 258"/>
      <path d="M481 284 L519 284"/>
      <path d="M483 308 L483 320 M517 308 L517 320"/>
      <path d="M480 340 L520 340"/>
      <path d="M482 406 L518 406"/>
      <path d="M484 448 L516 448"/>
      <path d="M486 490 L514 490"/>
      <path d="M487 528 L513 528"/>
    </g>
  </g>
</svg>
