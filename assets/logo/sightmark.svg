<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-labelledby="title desc">
  <title id="title">钢线 1944 — 瞄具标志</title>
  <desc id="desc">主菜单当前使用的虎式瞄具风格圆形标志，无内部文字。</desc>
  <defs>
    <filter id="glow-gold" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 主菜单的外圈边框与光晕 -->
  <circle cx="150" cy="150" r="135" fill="none" stroke="rgba(186,200,156,0.68)" stroke-width="2"/>
  <circle cx="150" cy="150" r="143" fill="none" stroke="rgba(193,216,198,0.55)" stroke-width="1.1"/>
  <circle cx="150" cy="150" r="132" fill="none" stroke="rgba(171,196,166,0.22)" stroke-width="1.1"/>

  <!-- 顶部指针 -->
  <path d="M136 10 H164 L150 38 Z" fill="#e6d6a4" stroke="rgba(247,232,184,0.85)" stroke-width="0.8" filter="url(#glow-gold)"/>

  <!-- 左侧密位点 -->
  <g fill="none" stroke="rgba(198,224,207,0.80)" stroke-width="1.35">
    <circle cx="79.3" cy="79.3" r="3.2"/>
    <circle cx="69.1" cy="91.2" r="3.2"/>
    <circle cx="60.9" cy="104.6" r="3.2"/>
    <circle cx="54.9" cy="119.1" r="3.2"/>
    <circle cx="51.2" cy="134.1" r="3.2"/>
    <circle cx="50" cy="150" r="3.2"/>
    <circle cx="51.2" cy="165.9" r="3.2"/>
    <circle cx="54.9" cy="180.9" r="3.2"/>
    <circle cx="60.9" cy="195.4" r="3.2"/>
    <circle cx="69.1" cy="208.8" r="3.2"/>
    <circle cx="79.3" cy="220.7" r="3.2"/>
  </g>

  <!-- 右侧主刻度点 -->
  <g fill="none" stroke="rgba(210,228,203,0.72)" stroke-width="1.35">
    <circle cx="166.7" cy="55.4" r="3.1"/>
    <circle cx="182.8" cy="59.8" r="3.1"/>
    <circle cx="198" cy="66.9" r="3.1"/>
    <circle cx="211.7" cy="76.5" r="3.1"/>
    <circle cx="223.5" cy="88.3" r="3.1"/>
    <circle cx="233.1" cy="102" r="3.1"/>
    <circle cx="240.2" cy="117.2" r="3.1"/>
    <circle cx="244.5" cy="133.3" r="3.1"/>
    <circle cx="246" cy="150" r="3.1"/>
    <circle cx="244.5" cy="166.7" r="3.1"/>
    <circle cx="240.2" cy="182.8" r="3.1"/>
    <circle cx="233.1" cy="198" r="3.1"/>
    <circle cx="223.5" cy="211.7" r="3.1"/>
    <circle cx="211.7" cy="223.5" r="3.1"/>
    <circle cx="198" cy="233.1" r="3.1"/>
    <circle cx="182.8" cy="240.2" r="3.1"/>
    <circle cx="166.7" cy="244.5" r="3.1"/>
  </g>

  <!-- 下方双排密位箭头 -->
  <g fill="none" stroke="rgba(216,230,201,0.80)" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M102 158 l8 -8 l8 8 M118 158 l8 -8 l8 8 M134 158 l8 -8 l8 8"/>
    <path d="M150 158 l8 -8 l8 8 M166 158 l8 -8 l8 8 M182 158 l8 -8 l8 8"/>
  </g>

  <!-- 中心准星 -->
  <path d="M150 142 L140 164 H160 Z" fill="none" stroke="#ead9a8" stroke-width="1.7" filter="url(#glow-gold)"/>
  <path d="M96 158 H138 M162 158 H204" fill="none" stroke="rgba(203,222,204,0.75)" stroke-width="1.1"/>
  <path d="M150 164 V270" fill="none" stroke="rgba(203,222,204,0.75)" stroke-width="1.1"/>
  <circle cx="150" cy="213" r="4.2" fill="none" stroke="rgba(203,222,204,0.75)" stroke-width="1.1"/>
  <circle cx="150" cy="241" r="4.2" fill="none" stroke="rgba(203,222,204,0.75)" stroke-width="1.1"/>
</svg>
