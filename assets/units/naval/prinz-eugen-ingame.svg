<svg xmlns="http://www.w3.org/2000/svg" viewBox="-120 -25 260 50" role="img" aria-labelledby="title desc">
  <title id="title">欧根亲王号 — 游戏内当前舰船素材</title>
  <desc id="desc">按钢线1944 NAVAL.drawShip 当前 Canvas 绘制逻辑整理的静态矢量版：蓝队、满血、初始炮塔朝向。</desc>
  <g fill="none" stroke-linejoin="round" stroke-linecap="round">
    <!-- 舰体：与 NAVAL.drawShip 的 hull path 一致 -->
    <path d="M-99.25 -6.54 Q-89.25 -10.9 -21.25 -10.9 L46.75 -10.9 Q89.25 -6.54 106.25 0 Q89.25 6.54 46.75 10.9 L-21.25 10.9 Q-89.25 10.9 -99.25 6.54 Q-106.25 0 -99.25 -6.54 Z"
          fill="#364e53" stroke="#8fbac0" stroke-width="1.15"/>

    <!-- 甲板 -->
    <ellipse cx="-4.25" cy="0" rx="76.5" ry="7.41" fill="#766a4e" fill-opacity="0.62"/>

    <!-- 上层建筑与烟囱 -->
    <rect x="-18" y="-6" width="34" height="12" fill="#303028"/>
    <rect x="-18" y="-6" width="34" height="12" stroke="#e1cf9c" stroke-opacity="0.65" stroke-width="0.55"/>
    <rect x="-48" y="-4.5" width="12" height="9" fill="#303028"/>
    <rect x="-62" y="-3" width="8" height="6" fill="#303028"/>

    <!-- 主炮：前二后二，初始朝舰首/舰尾 -->
    <g id="main-turrets">
      <g transform="translate(62 0)">
        <circle r="5.8" fill="#34342a" stroke="#d8c17a" stroke-width="0.75"/>
        <path d="M2.9 -1.2 L18.8 -1.2 M2.9 1.2 L18.8 1.2" stroke="#d8c17a" stroke-width="0.85"/>
      </g>
      <g transform="translate(28 0)">
        <circle r="5.8" fill="#34342a" stroke="#d8c17a" stroke-width="0.75"/>
        <path d="M2.9 -1.2 L18.8 -1.2 M2.9 1.2 L18.8 1.2" stroke="#d8c17a" stroke-width="0.85"/>
      </g>
      <g transform="translate(-38 0) rotate(180)">
        <circle r="5.8" fill="#34342a" stroke="#d8c17a" stroke-width="0.75"/>
        <path d="M2.9 -1.2 L18.8 -1.2 M2.9 1.2 L18.8 1.2" stroke="#d8c17a" stroke-width="0.85"/>
      </g>
      <g transform="translate(-74 0) rotate(180)">
        <circle r="5.8" fill="#34342a" stroke="#d8c17a" stroke-width="0.75"/>
        <path d="M2.9 -1.2 L18.8 -1.2 M2.9 1.2 L18.8 1.2" stroke="#d8c17a" stroke-width="0.85"/>
      </g>
    </g>

    <!-- 105mm 副炮：左右各三座 -->
    <g id="secondary-turrets">
      <g transform="translate(34 -8) rotate(-90)">
        <circle r="3.2" fill="#2e322b" stroke="#c8b27a" stroke-width="0.65"/>
        <path d="M1.6 -1 L10.2 -1 M1.6 1 L10.2 1" stroke="#c8b27a" stroke-width="0.7"/>
      </g>
      <g transform="translate(2 -8) rotate(-90)">
        <circle r="3.2" fill="#2e322b" stroke="#c8b27a" stroke-width="0.65"/>
        <path d="M1.6 -1 L10.2 -1 M1.6 1 L10.2 1" stroke="#c8b27a" stroke-width="0.7"/>
      </g>
      <g transform="translate(-30 -8) rotate(-90)">
        <circle r="3.2" fill="#2e322b" stroke="#c8b27a" stroke-width="0.65"/>
        <path d="M1.6 -1 L10.2 -1 M1.6 1 L10.2 1" stroke="#c8b27a" stroke-width="0.7"/>
      </g>
      <g transform="translate(34 8) rotate(90)">
        <circle r="3.2" fill="#2e322b" stroke="#c8b27a" stroke-width="0.65"/>
        <path d="M1.6 -1 L10.2 -1 M1.6 1 L10.2 1" stroke="#c8b27a" stroke-width="0.7"/>
      </g>
      <g transform="translate(2 8) rotate(90)">
        <circle r="3.2" fill="#2e322b" stroke="#c8b27a" stroke-width="0.65"/>
        <path d="M1.6 -1 L10.2 -1 M1.6 1 L10.2 1" stroke="#c8b27a" stroke-width="0.7"/>
      </g>
      <g transform="translate(-30 8) rotate(90)">
        <circle r="3.2" fill="#2e322b" stroke="#c8b27a" stroke-width="0.65"/>
        <path d="M1.6 -1 L10.2 -1 M1.6 1 L10.2 1" stroke="#c8b27a" stroke-width="0.7"/>
      </g>
    </g>

    <!-- 37mm 防空炮 -->
    <g id="aa37" stroke="#b7c6ad" stroke-width="0.62">
      <g transform="translate(48 -9) rotate(-90)"><circle r="1.7" fill="#2e322b"/><path d="M0 0 L8.7 0"/></g>
      <g transform="translate(10 -9) rotate(-90)"><circle r="1.7" fill="#2e322b"/><path d="M0 0 L8.7 0"/></g>
      <g transform="translate(-52 -9) rotate(-90)"><circle r="1.7" fill="#2e322b"/><path d="M0 0 L8.7 0"/></g>
      <g transform="translate(48 9) rotate(90)"><circle r="1.7" fill="#2e322b"/><path d="M0 0 L8.7 0"/></g>
      <g transform="translate(10 9) rotate(90)"><circle r="1.7" fill="#2e322b"/><path d="M0 0 L8.7 0"/></g>
      <g transform="translate(-52 9) rotate(90)"><circle r="1.7" fill="#2e322b"/><path d="M0 0 L8.7 0"/></g>
    </g>

    <!-- 20mm 机关炮 -->
    <g id="aa20" stroke="#aebfae" stroke-width="0.56">
      <g transform="translate(70 -10) rotate(-90)"><circle r="1.7" fill="#2e322b"/><path d="M0 0 L8.7 0"/></g>
      <g transform="translate(55 -10) rotate(-90)"><circle r="1.7" fill="#2e322b"/><path d="M0 0 L8.7 0"/></g>
      <g transform="translate(20 -10) rotate(-90)"><circle r="1.7" fill="#2e322b"/><path d="M0 0 L8.7 0"/></g>
      <g transform="translate(-18 -10) rotate(-90)"><circle r="1.7" fill="#2e322b"/><path d="M0 0 L8.7 0"/></g>
      <g transform="translate(-62 -10) rotate(-90)"><circle r="1.7" fill="#2e322b"/><path d="M0 0 L8.7 0"/></g>
      <g transform="translate(70 10) rotate(90)"><circle r="1.7" fill="#2e322b"/><path d="M0 0 L8.7 0"/></g>
      <g transform="translate(55 10) rotate(90)"><circle r="1.7" fill="#2e322b"/><path d="M0 0 L8.7 0"/></g>
      <g transform="translate(20 10) rotate(90)"><circle r="1.7" fill="#2e322b"/><path d="M0 0 L8.7 0"/></g>
      <g transform="translate(-18 10) rotate(90)"><circle r="1.7" fill="#2e322b"/><path d="M0 0 L8.7 0"/></g>
      <g transform="translate(-62 10) rotate(90)"><circle r="1.7" fill="#2e322b"/><path d="M0 0 L8.7 0"/></g>
    </g>

    <!-- 舰首方向箭头 -->
    <path d="M121.25 0 L109.25 -5 L109.25 5 Z" fill="#bfebde" stroke="#0e1814" stroke-width="0.5"/>
  </g>
</svg>
